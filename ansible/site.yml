---
# Installs exactly the technologies listed in output/install_vars.yml
# (generated by validate.py). Each technology is a separate role.
- name: Install requested technologies
  hosts: target
  become: true
  gather_facts: false
  vars_files:
    - ../output/install_vars.yml

  pre_tasks:
    - name: Wait for the server to accept SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    - name: Install base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, software-properties-common]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

  tasks:
    - name: Show what will be installed
      ansible.builtin.debug:
        msg: "{{ env_technologies | dict2items | map(attribute='key') | list }}"

    - name: Install each requested technology
      ansible.builtin.include_role:
        name: "{{ tech_name }}"
      vars:
        tech_version: "{{ env_technologies[tech_name].version }}"
      loop: "{{ env_technologies.keys() | list }}"
      loop_control:
        loop_var: tech_name
